name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test -p jizhu-core
      - run: cargo test -p jizhu

  ui-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: npm ci
      - name: UI checks
        env:
          JIZHU_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          SERVER=$!
          trap "kill $SERVER 2>/dev/null || true" EXIT
          for i in {1..40}; do
            curl -sf http://127.0.0.1:1420/ >/dev/null && break || sleep 1
          done
          node scripts/tiling-ui-check.mjs
          node scripts/feature-check.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - uses: EmbarkStudios/cargo-deny-action@v2
