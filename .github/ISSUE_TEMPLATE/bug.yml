name: Bug report
description: Report a reproducible problem in jizhu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets, tokens, or private data.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 14.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
