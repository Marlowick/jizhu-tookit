[package]
name = "jizhu"
version = "0.1.0"
description = "机杼 — 本地优先的开发者数据加工台"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "jizhu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jizhu-core = { path = "../crates/jizhu-core" }
sha2 = "0.11"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
