# 供应链基线（docs/supply-chain.md §4.1）
# 注意：配置 schema 随 cargo-deny 版本变化，升级后按官方文档校准。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [] # 每条豁免必须写原因与到期日

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "OFL-1.1",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
